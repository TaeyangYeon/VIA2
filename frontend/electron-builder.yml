appId: com.via2.app
productName: VIA2
directories:
  output: dist
files:
  - "**/*"
  - "!**/__pycache__/**"
  - "!**/node_modules/.cache/**"
  - "!tests/**"
  - "!*.md"
mac:
  target:
    - target: dmg
      arch: x64
  icon: build/icons/icon.icns
  category: public.app-category.developer-tools
dmg:
  title: "VIA2 ${version}"
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file
extraResources:
  - from: "../"
    to: "app"
    filter:
      - "backend/**"
      - "agents/**"
      - "light_test/**"
      - "requirements.txt"
